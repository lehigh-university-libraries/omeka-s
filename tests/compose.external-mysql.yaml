---
# Pre-provisioned MariaDB simulates an external Galera endpoint.
services:
  traefik:
    ports:
      - "80:80"
  omeka-s:
    environment:
      INGRESS_SCHEME: http
      DB_HOST: external-mysql
      DB_PORT: "3307"
      DB_NAME: omeka_test
      DB_USER: omeka_app
  external-mysql:
    image: mariadb:11
    command: ["--port=3307"]
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: omeka_test
      MARIADB_USER: omeka_app
      MARIADB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: OMEKA_S_DB_PASSWORD
        target: DB_PASSWORD
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
